query($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    nameWithOwner
    defaultBranchRef {
      name
    }
    issue(number: $number) {
      ...IssueSummary
      linkedBranches(first: 10) {
        ...IssueBranches
      }
      subIssues(first: 100) {
        totalCount
        nodes {
          ...IssueSummary
        }
      }
      parent {
        ...IssueSummary
        linkedBranches(first: 10) {
          ...IssueBranches
        }
        parent {
          ...IssueSummary
          parent {
            ...IssueSummary
            parent {
              ...IssueSummary
              parent {
                ...IssueSummary
                parent {
                  ...IssueSummary
                  parent {
                    ...IssueSummary
                    parent {
                      number
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment IssueSummary on Issue {
  number
  title
  state
  stateReason
  url
  labels(first: 20) {
    nodes {
      name
    }
  }
}

fragment IssueBranches on LinkedBranchConnection {
  totalCount
  nodes {
    ref {
      name
      repository {
        nameWithOwner
      }
    }
  }
}
