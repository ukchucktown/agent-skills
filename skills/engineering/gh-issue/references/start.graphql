query($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    nameWithOwner
    defaultBranchRef {
      name
    }
    issue(number: $number) {
      number
      title
      state
      url
      labels(first: 20) {
        nodes {
          name
        }
      }
      subIssues {
        totalCount
      }
      parent {
        number
        title
        state
        url
        labels(first: 20) {
          nodes {
            name
          }
        }
        subIssues(first: 100) {
          totalCount
          nodes {
            number
          }
        }
        parent {
          number
          title
          state
          url
          labels(first: 20) {
            nodes {
              name
            }
          }
          parent {
            number
            title
            state
            url
            labels(first: 20) {
              nodes {
                name
              }
            }
            parent {
              number
              title
              state
              url
              labels(first: 20) {
                nodes {
                  name
                }
              }
              parent {
                number
                title
                state
                url
                labels(first: 20) {
                  nodes {
                    name
                  }
                }
                parent {
                  number
                  title
                  state
                  url
                  labels(first: 20) {
                    nodes {
                      name
                    }
                  }
                  parent {
                    number
                    title
                    state
                    url
                    labels(first: 20) {
                      nodes {
                        name
                      }
                    }
                    parent {
                      number
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
