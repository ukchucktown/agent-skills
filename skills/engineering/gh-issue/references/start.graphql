query($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    nameWithOwner
    defaultBranchRef {
      name
    }
    issue(number: $number) {
      ...StartIssue
      subIssues {
        totalCount
      }
      parent {
        ...StartIssue
        subIssues(first: 100) {
          totalCount
          nodes {
            number
          }
        }
        parent {
          ...StartIssue
          parent {
            ...StartIssue
            parent {
              ...StartIssue
              parent {
                ...StartIssue
                parent {
                  ...StartIssue
                  parent {
                    ...StartIssue
                    parent {
                      number
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment StartIssue on Issue {
  number
  title
  state
  url
  labels(first: 20) {
    nodes {
      name
    }
  }
  linkedBranches(first: 10) {
    totalCount
    nodes {
      ref {
        name
        repository {
          nameWithOwner
        }
      }
    }
  }
}
