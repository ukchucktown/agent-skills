query($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    nameWithOwner
    defaultBranchRef {
      name
    }
    openPullRequests: pullRequests(states: OPEN, first: 100) {
      totalCount
      nodes {
        headRefName
        url
      }
    }
    issue(number: $number) {
      ...CleanIssue
      subIssues(first: 100) {
        totalCount
        nodes {
          ...CleanIssue
          subIssues(first: 20) {
            totalCount
            nodes {
              ...CleanIssue
              subIssues(first: 10) {
                totalCount
                nodes {
                  ...CleanIssue
                  subIssues {
                    totalCount
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment CleanIssue on Issue {
  number
  title
  state
  url
  linkedBranches(first: 10) {
    totalCount
    nodes {
      ref {
        name
        repository {
          nameWithOwner
        }
      }
    }
  }
}
