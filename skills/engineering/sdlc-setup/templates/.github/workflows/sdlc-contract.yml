name: SDLC PR contract

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Read trusted SDLC automation
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .sdlc/base

      - name: Detect first-time setup
        id: setup
        shell: node {0}
        run: |
          const { appendFileSync, existsSync } = require("node:fs");
          const configured = existsSync(".sdlc/base/.github/scripts/sdlc-pr-contract.mjs");
          appendFileSync(process.env.GITHUB_OUTPUT, `configured=${configured}\n`);

      - name: Validate pull request contract
        if: steps.setup.outputs.configured == 'true'
        id: contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node .sdlc/base/.github/scripts/sdlc-pr-contract.mjs validate
          --event "$GITHUB_EVENT_PATH"
          --config .sdlc/base/docs/agents/sdlc.md

      - name: Check out pull request code
        if: steps.setup.outputs.configured == 'true' && steps.contract.outputs.profile != 'none'
        uses: actions/checkout@v5
        with:
          path: .sdlc/head

      - name: Run configured validation
        if: steps.setup.outputs.configured == 'true' && steps.contract.outputs.profile != 'none'
        run: >-
          node .sdlc/base/.github/scripts/sdlc-pr-contract.mjs run-validation
          --profile "${{ steps.contract.outputs.profile }}"
          --repository-root .sdlc/head
          --config .sdlc/base/docs/agents/sdlc.md
