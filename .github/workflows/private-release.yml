name: Private release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from package.json
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/check-release.mjs --expected "${{ inputs.version }}"
      - name: Create private repository tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "agent-skills-v${RELEASE_VERSION}" -m "agent-skills ${RELEASE_VERSION}"
          git push origin "agent-skills-v${RELEASE_VERSION}"
          gh release create "agent-skills-v${RELEASE_VERSION}" --generate-notes --verify-tag --title "agent-skills ${RELEASE_VERSION}"
